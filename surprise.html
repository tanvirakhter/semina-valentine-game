<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Surprise for Semina 💘</title>
<meta name="theme-color" content="#ff4fa3" />

<style>
:root{
  --pink:#ff4fa3;
  --pink2:#ff85c2;
  --card:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.14);
  --text:rgba(255,255,255,.92);
  --muted:rgba(255,255,255,.72);
  --shadow: 0 18px 55px rgba(0,0,0,.45);
  --radius: 22px;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

html,body{
  height:100%;
  margin:0;
  background:
    radial-gradient(1200px 700px at 50% -10%, rgba(255,79,163,.22), transparent 55%),
    radial-gradient(900px 600px at 90% 30%, rgba(130,120,255,.16), transparent 60%),
    #0b0b12;
  color: var(--text);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
}

.wrap{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.phone{
  width:min(430px,100%);
  border-radius:26px;
  overflow:hidden;
  box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.10);
  background:rgba(0,0,0,.20);
  position:relative;
}

.topGlow{
  position:absolute;
  inset:-60px -60px auto -60px;
  height:220px;
  background: radial-gradient(circle at 50% 40%, rgba(255,79,163,.26), transparent 60%);
  pointer-events:none;
}

header{
  padding:22px 18px 8px;
  text-align:center;
  position:relative;
  z-index:1;
}

.badge{
  display:inline-flex;
  gap:8px;
  align-items:center;
  padding:8px 12px;
  border-radius:999px;
  background: rgba(255,79,163,.14);
  border:1px solid rgba(255,79,163,.22);
  font-weight:800;
  font-size:13px;
}

h1{
  margin:14px 0 6px;
  font-size:28px;
  letter-spacing:-0.02em;
}

.sub{
  margin:0 auto 6px;
  max-width:34ch;
  color:var(--muted);
  font-weight:600;
  font-size:14px;
}

/* ⭐ Your character animation */
@keyframes spriteFloat {
  0%   { transform: translateY(0) rotate(-1deg); }
  50%  { transform: translateY(-8px) rotate(1deg); }
  100% { transform: translateY(0) rotate(-1deg); }
}

.avatarWrap{
  display:flex;
  justify-content:center;
  margin-top:6px;
}

.avatarWrap img{
  width:140px;           /* adjust size here */
  height:auto;
  display:block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  filter: drop-shadow(0 14px 24px rgba(0,0,0,.45));
  animation: spriteFloat 2.4s ease-in-out infinite;
  transform-origin: 50% 85%;
  will-change: transform;
}

@media (prefers-reduced-motion: reduce){
  .avatarWrap img{ animation: none; }
}

.content{
  padding:10px 16px 18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  position:relative;
  z-index:1;
}

.card{
  background:var(--card);
  border:1px solid var(--stroke);
  border-radius:var(--radius);
  padding:16px;
  backdrop-filter: blur(10px);
}

.cardTitle{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.pill{
  font-size:12px;
  font-weight:800;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  padding:6px 10px;
  border-radius:999px;
}

.type{
  font-size:15px;
  line-height:1.55;
  min-height:92px;
  white-space:pre-wrap;
}

.hint{
  margin-top:10px;
  display:flex;
  justify-content:center;
  font-size:12px;
  color:rgba(255,255,255,.70);
}

.btnRow{
  display:flex;
  gap:10px;
  margin-top:8px;
}

button{
  border-radius:16px;
  padding:12px 14px;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  width:100%;
  color:white;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.14);
  transition: transform .08s ease;
}

button:active{ transform: scale(.98); }

.primary{
  background: linear-gradient(135deg,var(--pink),var(--pink2));
}

.final{
  text-align:center;
  padding:18px 16px 22px;
}

.small{
  font-size:12px;
  color:rgba(255,255,255,.65);
  text-align:center;
  padding-bottom:18px;
}

/* ❤️ Final Love Screen */
.loveScreen{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .6s ease;
  z-index:999;
}

.loveScreen.show{
  opacity:1;
  pointer-events:auto;
}

.loveScreen img{
  width:260px;
  max-width:86%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  filter: drop-shadow(0 18px 30px rgba(0,0,0,.55));
  margin-bottom:18px;
  animation: popIn .6s ease forwards;
}

.loveText{
  font-size:30px;
  font-weight:900;
  color:#ff4fa3;
  opacity:0;
  animation: fadeIn 1.2s ease forwards .45s;
  text-align:center;
  letter-spacing:-0.01em;
}

.loveHint{
  margin-top:10px;
  font-size:12px;
  font-weight:700;
  color:rgba(255,255,255,.65);
  opacity:0;
  animation: fadeIn 1.2s ease forwards .8s;
}

@keyframes popIn{
  from{ transform:scale(.72); opacity:0;}
  to{ transform:scale(1); opacity:1;}
}

@keyframes fadeIn{
  from{ opacity:0; transform:translateY(10px);}
  to{ opacity:1; transform:translateY(0);}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="phone">
    <div class="topGlow"></div>

    <header>
      <div class="badge">💘 Surprise Unlocked</div>
      <h1>Semina, this is for you</h1>
      <p class="sub">Made with love — and a little bit of code 😌</p>

      <div class="avatarWrap">
        <img src="tanvir.png" alt="Tanvir">
      </div>
    </header>

    <div class="content">
      <div class="card">
        <div class="cardTitle">
          <strong>💌 A little note</strong>
          <span class="pill" id="pill">Tap to type</span>
        </div>

        <div class="type" id="type"></div>

        <div class="btnRow">
          <button id="typeBtn" class="primary">Start the Letter ✨</button>
          <button id="skipBtn">Skip</button>
        </div>

        <div class="hint">Tip: turn your volume up 🎵</div>
      </div>

      <div class="card final">
        <h3>So… one question 😌</h3>
        <p>Will you be my Valentine? 💖</p>

        <div class="btnRow">
          <button class="primary" id="yesBtn">YES 💘</button>
          <button id="backBtn">Back to game</button>
        </div>
      </div>

      <div class="small">Made with ❤️</div>
    </div>
  </div>
</div>

<!-- ❤️ FINAL LOVE SCREEN (shows after YES) -->
<div class="loveScreen" id="loveScreen" aria-hidden="true">
  <img src="together.png" alt="Together">
  <div class="loveText">I love you ❤️</div>
  <div class="loveHint">Tap anywhere to close</div>
</div>

<script>
const bgMusic = new Audio("music.mp3");
bgMusic.loop = true;
bgMusic.volume = 0.35;

let musicStarted=false;
function startMusic(){
  if(musicStarted) return;
  musicStarted=true;
  bgMusic.play().catch(()=>{});
}

const letter = `Hey Semina,

I made this little game because you make life feel lighter.

Every heart you caught is something I genuinely feel about you.

Every heart you caught is something I genuinely feel about you.

Thank you for being you —
for your kindness, your patience, and your warmth.

I’m proud of you, and I’m grateful you’re in my life.

Happy Valentine’s Day 💖

— Tanvir`;

const typeEl = document.getElementById("type");
const pill = document.getElementById("pill");

let i=0, timer=null, done=false, typing=false;

function typeStart(){
  startMusic();
  if (typing || done) return;
  typing = true;
  pill.textContent="Typing…";

  timer=setInterval(()=>{
    typeEl.textContent+=letter[i]||"";
    i++;
    if(i>=letter.length){
      clearInterval(timer);
      typing=false;
      done=true;
      pill.textContent="Done 💘";
    }
  },18);
}

function typeSkip(){
  startMusic();
  if (done) return;
  clearInterval(timer);
  typeEl.textContent=letter;
  typing=false;
  done=true;
  pill.textContent="Done 💘";
}

document.getElementById("typeBtn").onclick=typeStart;
document.getElementById("skipBtn").onclick=typeSkip;

document.getElementById("backBtn").onclick=()=>{
  location.href="index.html";
};

// ❤️ YES => show final love screen + hearts
const loveScreen = document.getElementById("loveScreen");

function burstLoveHearts(){
  const emojis = ["💖","💘","💞","💝","✨"];
  for(let i=0;i<34;i++){
    const h=document.createElement("div");
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    h.style.position="fixed";
    h.style.left=(Math.random()*100)+"%";
    h.style.bottom="-30px";
    h.style.fontSize=(16+Math.random()*22)+"px";
    h.style.opacity="0.95";
    h.style.zIndex="1000";
    h.style.transition="transform 2.1s ease, opacity 2.1s ease";
    document.body.appendChild(h);

    setTimeout(()=>{
      h.style.transform = `translateY(-120vh) translateX(${(Math.random()*120-60).toFixed(0)}px)`;
      h.style.opacity="0";
    }, 40);

    setTimeout(()=>h.remove(), 2200);
  }
}

document.getElementById("yesBtn").onclick=()=>{
  startMusic();
  loveScreen.classList.add("show");
  loveScreen.setAttribute("aria-hidden","false");
  burstLoveHearts();
};

// Tap anywhere on love screen to close it
loveScreen.addEventListener("pointerdown", ()=>{
  loveScreen.classList.remove("show");
  loveScreen.setAttribute("aria-hidden","true");
});

// Start music on any tap (mobile autoplay rules)
document.addEventListener("pointerdown", startMusic, { once:true });
</script>

</body>
</html>
