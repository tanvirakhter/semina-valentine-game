<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Surprise for Semina 💘</title>
<meta name="theme-color" content="#ff4fa3" />

<style>
:root{
  --pink:#ff4fa3;
  --pink2:#ff85c2;
  --card:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.14);
  --text:rgba(255,255,255,.92);
  --muted:rgba(255,255,255,.72);
  --shadow: 0 18px 55px rgba(0,0,0,.45);
  --radius: 22px;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{
  height:100%;
  margin:0;
  background: #140914;
  color: var(--text);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
}


.wrap{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.phone{
  width:min(430px,100%);
  border-radius:26px;
  overflow:hidden;
  box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.10);
  background:rgba(0,0,0,.20);
  position:relative;
}


header{
  padding:22px 18px 10px;
  text-align:center;
  position:relative;
  z-index:1;
}

.badge{
  display:inline-flex;
  gap:8px;
  align-items:center;
  padding:8px 12px;
  border-radius:999px;
  background: rgba(255,79,163,.14);
  border:1px solid rgba(255,79,163,.22);
  font-weight:800;
  font-size:13px;
}

h1{
  margin:14px 0 6px;
  font-size:28px;
  letter-spacing:-0.02em;
}

.sub{
  margin:0 auto 10px;
  max-width:34ch;
  color:var(--muted);
  font-weight:600;
  font-size:14px;
}

/* ⭐ Character block + fixed gradient behind */
@keyframes spriteFloat {
  0%   { transform: translateY(0) rotate(-1deg); }
  50%  { transform: translateY(-8px) rotate(1deg); }
  100% { transform: translateY(0) rotate(-1deg); }
}

.heroChar{
  display:flex;
  justify-content:center;
  margin-top: 4px;
  margin-bottom: 10px;
  position: relative;
}

.heroChar::before{
  content:"";
  position:absolute;
  width: 180px;
  height: 180px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(255,79,163,0.35) 0%,
    rgba(255,79,163,0.15) 35%,
    rgba(255,79,163,0.05) 55%,
    transparent 75%
  );
  filter: blur(10px);
  opacity: 0.9;
  pointer-events:none;
}

.heroChar img{
  width: 180px;            /* bigger */
  height:auto;
  display:block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  filter: drop-shadow(0 14px 24px rgba(0,0,0,.45));
  animation: spriteFloat 2.4s ease-in-out infinite;
  transform-origin: 50% 85%;
  will-change: transform;
  position: relative;
  z-index: 1;
}

@media (prefers-reduced-motion: reduce){
  .heroChar img{ animation: none; }
}

.content{
  padding: 6px 16px 18px;
  display:flex;
  flex-direction:column;
  gap:12px;
  position:relative;
  z-index:1;
}

.card{
  background:var(--card);
  border:1px solid var(--stroke);
  border-radius:var(--radius);
  padding:16px;
  backdrop-filter: blur(10px);
}

.cardTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap: 10px;
  margin-bottom:10px;
}

.cardTitle strong{
  font-size: 18px;
  letter-spacing: -0.01em;
}

.pill{
  font-size:12px;
  font-weight:800;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  padding:6px 10px;
  border-radius:999px;
}

.type{
  font-size:15px;
  line-height:1.55;
  min-height:108px;
  white-space:pre-wrap;
  color: rgba(255,255,255,.90);
}

.hint{
  margin-top:10px;
  display:flex;
  justify-content:center;
  font-size:12px;
  color:rgba(255,255,255,.70);
}

.btnRow{
  display:flex;
  gap:10px;
  margin-top:10px;
}

button{
  border-radius:16px;
  padding:12px 14px;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  width:100%;
  color:white;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.14);
  transition: transform .08s ease;
}
button:active{ transform: scale(.98); }

.primary{
  background: linear-gradient(135deg,var(--pink),var(--pink2));
  border: 1px solid rgba(255,79,163,.55);
}

.final{
  text-align:center;
  padding:18px 16px 20px;
}

.final h3{
  margin: 0 0 8px;
  font-size: 22px;
  letter-spacing: -0.01em;
}

.final p{
  margin: 0 0 12px;
  color: rgba(255,255,255,.84);
  font-weight: 650;
}

.small{
  font-size:12px;
  color:rgba(255,255,255,.65);
  text-align:center;
  padding-bottom:10px;
}

/* hidden utility */
.hidden{ display:none !important; }

/* Bottom back button bar */
.bottomBar{
  margin-top: 2px;
}
</style>
</head>
<body>

<div class="wrap">
  <div class="phone">
    <div class="topGlow"></div>

    <header>
      <div class="badge">💘 Surprise Unlocked</div>
      <h1>Semina, this is for you</h1>
      <p class="sub">Made with love and a little bit of code 😌</p>

      <div class="heroChar">
        <img src="tanvir.png" alt="Tanvir">
      </div>
    </header>

    <div class="content">

      <!-- Letter card -->
      <div class="card" id="letterCard">
        <div class="cardTitle">
          <strong>💌 A little note</strong>
          <span class="pill" id="pill">Tap to start</span>
        </div>

        <div class="type" id="type"></div>

        <div class="btnRow">
          <button id="typeBtn" class="primary">Start the Letter ✨</button>
        </div>

        <div class="hint">Tip: turn your volume up 🎵</div>
      </div>

      <!-- Question card (hidden until letter finishes) -->
      <div class="card final hidden" id="questionCard">
        <h3>So… one question 😌</h3>
        <p>Will you be my Valentine? 💖</p>
        <div class="btnRow">
          <button class="primary" id="yesBtn">YES 💘</button>
        </div>
      </div>

      <!-- Back button at bottom -->
      <div class="bottomBar">
        <button id="backBtn">Back to game</button>
      </div>

      <div class="small">Tanvir made it with ❤️</div>
    </div>
  </div>
</div>

<!-- ❤️ FINAL LOVE SCREEN -->
<div class="loveScreen" id="loveScreen" aria-hidden="true" style="
  position:fixed; inset:0; background:rgba(0,0,0,.92);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .6s ease; z-index:999;">
  <img src="together.png" alt="Together" style="
    width:260px; max-width:86%;
    image-rendering:pixelated; image-rendering:crisp-edges;
    filter:drop-shadow(0 18px 30px rgba(0,0,0,.55));
    margin-bottom:18px;">
  <div style="font-size:30px; font-weight:900; color:#ff4fa3; text-align:center;">I love you ❤️</div>
  <div style="margin-top:10px; font-size:12px; font-weight:700; color:rgba(255,255,255,.65);">Tap anywhere to close</div>
</div>

<script>
const bgMusic = new Audio("music.mp3");
bgMusic.loop = true;
bgMusic.volume = 0.35;

let musicStarted=false;
function startMusic(){
  if(musicStarted) return;
  musicStarted=true;
  bgMusic.play().catch(()=>{});
}

const letter = `Hey Semina,
I made this little game because you make life feel lighter. Every heart you catch is something I truly feel about you. You are my home, the place where I feel calm and happy no matter what.
Thank you for being you, for your kindness, your patience, and your warmth. I’m proud of you, and I’m so grateful that you’re in my life.
Happy Valentine’s Day 💖
- Tanvir`;

const typeEl = document.getElementById("type");
const pill = document.getElementById("pill");
const typeBtn = document.getElementById("typeBtn");

const questionCard = document.getElementById("questionCard");

let i=0, timer=null, done=false, typing=false;

function setPill(t){ pill.textContent = t; }

function revealQuestion(){
  questionCard.classList.remove("hidden");
  // small scroll nudge on phone so she sees it
  setTimeout(() => questionCard.scrollIntoView({ behavior:"smooth", block:"nearest" }), 200);
}

function typeStart(){
  startMusic();
  if (typing || done) return;
  typing = true;
  setPill("Typing…");
  typeBtn.disabled = true;
  typeBtn.textContent = "Writing… 💌";

  timer=setInterval(()=>{
    typeEl.textContent += letter[i] || "";
    i++;
    if(i >= letter.length){
      clearInterval(timer);
      typing=false;
      done=true;
      setPill("Done 💘");
      typeBtn.textContent = "Letter finished 💖";
      revealQuestion();
    }
  }, 18);
}

typeBtn.addEventListener("click", typeStart);

// Back button always at bottom
document.getElementById("backBtn").onclick=()=>{
  location.href="index.html";
};

// YES => final screen + hearts
const loveScreen = document.getElementById("loveScreen");

function showLoveScreen(){
  loveScreen.style.opacity = "1";
  loveScreen.style.pointerEvents = "auto";
  loveScreen.setAttribute("aria-hidden","false");
}

function hideLoveScreen(){
  loveScreen.style.opacity = "0";
  loveScreen.style.pointerEvents = "none";
  loveScreen.setAttribute("aria-hidden","true");
}

function burstLoveHearts(){
  const emojis = ["💖","💘","💞","💝","✨"];
  for(let k=0;k<34;k++){
    const h=document.createElement("div");
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    h.style.position="fixed";
    h.style.left=(Math.random()*100)+"%";
    h.style.bottom="-30px";
    h.style.fontSize=(16+Math.random()*22)+"px";
    h.style.opacity="0.95";
    h.style.zIndex="1000";
    h.style.transition="transform 2.1s ease, opacity 2.1s ease";
    document.body.appendChild(h);

    setTimeout(()=>{
      h.style.transform = `translateY(-120vh) translateX(${(Math.random()*120-60).toFixed(0)}px)`;
      h.style.opacity="0";
    }, 40);

    setTimeout(()=>h.remove(), 2200);
  }
}

document.getElementById("yesBtn").onclick=()=>{
  startMusic();
  showLoveScreen();
  burstLoveHearts();
};

// Tap anywhere on love screen to close
loveScreen.addEventListener("pointerdown", hideLoveScreen);

// Start music on any tap (mobile autoplay rules)
document.addEventListener("pointerdown", startMusic, { once:true });
</script>

</body>
</html>
