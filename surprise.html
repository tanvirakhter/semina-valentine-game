<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Surprise for Semina 💘</title>
  <meta name="theme-color" content="#ff4fa3" />

  <style>
    :root{
      --pink:#ff4fa3;
      --pink2:#ff85c2;
      --bg:#0b0b12;
      --card:rgba(255,255,255,.08);
      --stroke:rgba(255,255,255,.14);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.72);
      --shadow: 0 18px 55px rgba(0,0,0,.45);
      --radius: 22px;
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html,body{ height:100%; margin:0; background: radial-gradient(1200px 700px at 50% -10%, rgba(255,79,163,.22), transparent 55%),
                                        radial-gradient(900px 600px at 90% 30%, rgba(130,120,255,.16), transparent 60%),
                                        #0b0b12;
               color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }

    .wrap{
      min-height: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
    }

    .phone{
      width: min(430px, 100%);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.20);
      position: relative;
    }

    .topGlow{
      position:absolute; inset:-60px -60px auto -60px;
      height: 220px;
      background: radial-gradient(circle at 50% 40%, rgba(255,79,163,.26), transparent 60%);
      pointer-events:none;
      filter: blur(2px);
    }

    header{
      padding: 22px 18px 10px;
      text-align:center;
      position:relative;
      z-index:2;
    }

    .badge{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,79,163,.14);
      border: 1px solid rgba(255,79,163,.22);
      color: rgba(255,255,255,.92);
      font-weight: 800;
      font-size: 13px;
    }

    h1{
      margin: 14px 0 6px;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .sub{
      margin: 0 auto 14px;
      max-width: 34ch;
      color: var(--muted);
      font-weight: 600;
      font-size: 14px;
    }

    .content{
      padding: 10px 16px 18px;
      display:flex;
      flex-direction:column;
      gap: 12px;
      position:relative;
      z-index:2;
    }

    .card{
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      padding: 16px;
      backdrop-filter: blur(10px);
    }

    .cardTitle{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .cardTitle h2{
      margin:0;
      font-size: 16px;
      letter-spacing: -0.01em;
    }

    .pill{
      font-size: 12px;
      font-weight: 800;
      color: rgba(255,255,255,.88);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      padding: 6px 10px;
      border-radius: 999px;
    }

    .type{
      font-size: 15px;
      line-height: 1.55;
      color: rgba(255,255,255,.90);
      min-height: 92px;
      white-space: pre-wrap;
    }

    .hint{
      margin-top: 10px;
      display:flex;
      justify-content:center;
      font-size: 12px;
      color: rgba(255,255,255,.70);
    }

    .btnRow{
      display:flex;
      gap: 10px;
      margin-top: 8px;
    }

    button{
      appearance:none;
      border: 0;
      border-radius: 16px;
      padding: 12px 14px;
      font-weight: 900;
      font-size: 14px;
      cursor:pointer;
      width: 100%;
      color: rgba(255,255,255,.95);
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.14);
      transition: transform .08s ease, background .2s ease;
    }
    button:active{ transform: scale(.98); }

    .primary{
      background: linear-gradient(135deg, rgba(255,79,163,.95), rgba(255,133,194,.88));
      border: 1px solid rgba(255,79,163,.55);
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .ph{
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      background: rgba(255,255,255,.07);
      border: 1px dashed rgba(255,255,255,.18);
      display:flex;
      align-items:center;
      justify-content:center;
      color: rgba(255,255,255,.55);
      font-weight: 800;
      font-size: 12px;
      overflow:hidden;
      position:relative;
    }
    .ph img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .final{
      text-align:center;
      padding: 18px 16px 22px;
    }
    .final h3{
      margin: 0 0 6px;
      font-size: 18px;
      letter-spacing: -0.01em;
    }
    .final p{
      margin: 0 0 14px;
      color: rgba(255,255,255,.78);
      font-weight: 600;
      font-size: 14px;
      line-height: 1.45;
    }

    .small{
      font-size: 12px;
      color: rgba(255,255,255,.65);
      text-align:center;
      padding-bottom: 18px;
    }

    /* Confetti hearts */
    .fx{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index: 3;
    }
    .heart{
      position:absolute;
      font-size: 18px;
      opacity: 0;
      transform: translateY(20px);
      animation: floatUp 1.8s ease forwards;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.35));
    }
    @keyframes floatUp{
      0%{ opacity:0; transform: translateY(20px) scale(.9); }
      10%{ opacity:1; }
      100%{ opacity:0; transform: translateY(-240px) scale(1.2); }
    }

    /* Tap-to-reveal section */
    .revealBtn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 8px;
      margin-top: 10px;
      font-weight: 900;
      color: rgba(255,255,255,.92);
    }

    .hidden{
      display:none;
    }

  </style>
</head>
<body>
  <div class="wrap">
    <div class="phone">
      <div class="topGlow"></div>
      <div class="fx" id="fx"></div>

      <header>
        <div class="badge">💘 Surprise Unlocked</div>
        <h1>Semina, this is for you</h1>
        <p class="sub">Made with love — and a little bit of code 😌</p>
      </header>

      <div class="content">
        <!-- Love letter -->
        <div class="card">
          <div class="cardTitle">
            <h2>💌 A little note</h2>
            <span class="pill" id="pill">Tap to type</span>
          </div>
          <div class="type" id="type"></div>

          <div class="btnRow">
            <button id="typeBtn" class="primary">Start the Letter ✨</button>
            <button id="skipBtn">Skip</button>
          </div>

          <div class="hint">Tip: turn your volume up 🎵</div>
        </div>

        <!-- The question -->
        <div class="card final">
          <h3>So… one question 😌</h3>
          <p>Will you be my Valentine? 💖</p>

          <div class="btnRow">
            <button class="primary" id="yesBtn">YES 💘</button>
            <button id="backBtn">Back to game</button>
          </div>
        </div>

        <div class="small">Made by Tanvir — just for Semina ❤️</div>
      </div>
    </div>
  </div>

  <script>
    // Optional: start the same music if you want (uses your existing music.mp3)
    const bgMusic = new Audio("music.mp3");
    bgMusic.loop = true;
    bgMusic.volume = 0.35;

    let musicStarted = false;
    function startMusic(){
      if (musicStarted) return;
      musicStarted = true;
      bgMusic.play().catch(()=>{});
    }

    // Typewriter letter (edit this text!)
    const letter = [
      "Hey Semina,",
      "",
      "I made this little game because you make life feel lighter.",
      "Every heart you caught is something I genuinely feel about you.",
      "",
      "Thank you for being you — for your kindness, your patience, and your warmth.",
      "I’m proud of you, and I’m grateful you’re in my life.",
      "",
      "Happy Valentine’s Day 💖",
      "— Tanvir"
    ].join("\\n");

    const typeEl = document.getElementById("type");
    const pill = document.getElementById("pill");
    const typeBtn = document.getElementById("typeBtn");
    const skipBtn = document.getElementById("skipBtn");

    let typing = false;
    let done = false;
    let i = 0;
    let timer = null;

    function setPill(text){ pill.textContent = text; }

    function typeStart(){
      startMusic();
      if (typing || done) return;
      typing = true;
      setPill("Typing…");

      timer = setInterval(() => {
        typeEl.textContent += letter[i] || "";
        i++;
        if (i >= letter.length) {
          clearInterval(timer);
          typing = false;
          done = true;
          setPill("Done 💘");
        }
      }, 18);
    }

    function typeSkip(){
      startMusic();
      clearInterval(timer);
      typeEl.textContent = letter;
      typing = false;
      done = true;
      setPill("Done 💘");
    }

    typeBtn.addEventListener("click", typeStart);
    skipBtn.addEventListener("click", typeSkip);

    // Confetti hearts
    const fx = document.getElementById("fx");
    function burstHearts(){
      startMusic();
      const emojis = ["💘","💖","💗","💞","💝","✨"];
      for (let k=0; k<26; k++){
        const el = document.createElement("div");
        el.className = "heart";
        el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        el.style.left = (Math.random()*100) + "%";
        el.style.bottom = "-20px";
        el.style.animationDelay = (Math.random()*0.25) + "s";
        el.style.fontSize = (14 + Math.random()*18) + "px";
        fx.appendChild(el);
        setTimeout(()=> el.remove(), 2200);
      }
    }

    // Buttons
    document.getElementById("yesBtn").addEventListener("click", () => {
      burstHearts();
      setPill("She said YES 😭💘");
      // Optional: show an alert too
      setTimeout(() => {
        alert("I love you Semina 💖");
      }, 600);
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    // Start music on any tap (mobile autoplay rules)
    document.addEventListener("pointerdown", startMusic, { once: true });
  </script>
</body>
</html>
